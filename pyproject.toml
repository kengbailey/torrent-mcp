[tool.poetry]
name = "torrent-mcp"
version = "0.1.0"
description = "MCP server for torrent search (Jackett) and management (Transmission)"
authors = []
readme = "README.md"
packages = [{include = "torrent_mcp"}]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^3.1"
httpx = "^0.28"
pydantic-settings = "^2.7"
structlog = "^25.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11"
mypy = "^1.15"
pytest = "^8.3"
pytest-asyncio = "^0.25"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
